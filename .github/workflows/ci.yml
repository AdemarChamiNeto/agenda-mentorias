name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-retries 20
    env:
      # dono do banco SEM superusuário, igual ao Neon (criado pelo docker/init.sql)
      DATABASE_URL: postgresql://agenda:agenda-dev@localhost:5432/agenda_test
      DATABASE_URL_TESTE: postgresql://agenda:agenda-dev@localhost:5432/agenda_test
    steps:
      - uses: actions/checkout@v7
      - name: Papel e bancos (docker/init.sql)
        run: PGPASSWORD=postgres-ci psql -h localhost -U postgres -f docker/init.sql
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t agenda-mentorias .
